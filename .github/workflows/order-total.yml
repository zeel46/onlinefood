name: Order Total

on:
  push:
    branches: [ main ]

jobs:
  run-order-total:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run order total script
        run: python order_total.py